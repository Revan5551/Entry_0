<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>ENTRY 0</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; background:#000; color:#d8d8d8; }
body {
  font-family: "Courier New", Courier, monospace;
  font-size: 14px;
  letter-spacing: .035em;
  overflow-x:hidden;
}
body::before {
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.12;
  background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(255,255,255,.035) 4px);
}
#screen {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:48px 22px; position:relative;
}
#archive { width:min(620px, 100%); min-height:330px; display:flex; flex-direction:column; justify-content:center; }
.eyebrow { color:#555; font-size:10px; letter-spacing:.22em; margin-bottom:34px; }
h1 { font-size:clamp(21px,4vw,30px); font-weight:normal; color:#eee; letter-spacing:.12em; margin:0 0 28px; }
.entry-title { color:#777; font-size:11px; letter-spacing:.2em; margin-bottom:24px; }
.copy { line-height:2.05; white-space:pre-line; color:#c9c9c9; min-height:125px; }
.dim { color:#555; }
.red { color:#733d3d; }
.controls { display:flex; gap:24px; align-items:center; margin-top:42px; min-height:24px; }
button {
  border:0; background:transparent; color:#888; padding:4px 0; cursor:pointer;
  font:inherit; letter-spacing:.12em; font-size:11px;
}
button:hover { color:#fff; }
button:focus-visible, a:focus-visible { outline:1px solid #777; outline-offset:5px; }
#counter { color:#383838; font-size:10px; letter-spacing:.15em; }
#cursor { display:inline-block; width:7px; height:14px; background:#aaa; vertical-align:middle; margin-left:3px; animation:blink 1s steps(2,start) infinite; }
@keyframes blink { to { visibility:hidden; } }
#hidden-star {
  position:fixed; right:22px; bottom:17px; color:#090909; text-decoration:none;
  font-size:15px; padding:8px; transition:color .4s;
}
#hidden-star:hover, #hidden-star:focus { color:#777; }
#burned { display:none; text-align:center; color:#444; letter-spacing:.22em; font-size:11px; }
#burned small { display:block; margin-top:22px; color:#171717; letter-spacing:.12em; }
.fade { animation:fadeout 1.8s ease forwards; }
@keyframes fadeout { to { opacity:0; filter:blur(5px); } }
@media (max-width:480px) { #screen { padding:30px 24px; } .copy { font-size:13px; } }
</style>
</head>
<body>
<main id="screen">
  <section id="archive" aria-live="polite">
    <div class="eyebrow">NO TITLE / NO AUTHOR / NO DATE</div>
    <h1>ENTRY 0</h1>
    <div class="copy" id="copy">THE WORLD HAS ALREADY BEEN WRITTEN.</div>
    <div class="controls">
      <button id="next" type="button">[ CONTINUE ]</button>
      <span id="counter">00 / 06</span>
    </div>
  </section>
  <section id="burned" aria-live="polite">
    <div>THERE IS NOTHING HERE.</div>
    <small>THE RECORD IS NO LONGER AVAILABLE.</small>
  </section>
</main>

<!-- A route that was not meant to be found. -->
<a id="hidden-star" href="https://revan5551.github.io/DSON---Internal-Research-Database/" aria-label="Open the other archive" title="">.</a>

<script>
(() => {
  const STORAGE_KEY = "entry0_archive_burned_v1";
  const archive = document.getElementById("archive");
  const burned = document.getElementById("burned");
  const title = archive.querySelector("h1");
  const copy = document.getElementById("copy");
  const next = document.getElementById("next");
  const counter = document.getElementById("counter");
  const star = document.getElementById("hidden-star");

  // This is browser-local persistence, not IP tracking.
  let alreadyBurned = false;
  try { alreadyBurned = localStorage.getItem(STORAGE_KEY) === "yes"; } catch (_) {}
  if (alreadyBurned) {
    archive.remove();
    burned.style.display = "block";
  }

  // Tiny navigation point: visible only if someone knows where to look.
  star.addEventListener("click", () => {});

  const entries = [
    { name:"ENTRY 01 — THE STRONGEST", text:
`THE STRONGEST FELL.

THE KING WAS DEFEATED.

THE WORLD CONTINUED TO TURN.

THAT WAS NOT THE END.` },
    { name:"ENTRY 02 — TERMS", text:
`AN AGREEMENT WAS MADE.

THE TERMS WERE NOT RECORDED.
THE WITNESSES WERE NOT NAMED.

ONE PROMISE REMAINS UNFULFILLED.` },
    { name:"ENTRY 03 — THE ROARING", text:
`THE BOUNDARIES ARE THINNING.

WHAT WAS SEPARATED
WILL NOT REMAIN SEPARATE.

DO NOT CALL IT A BEGINNING.` },
    { name:"ENTRY 04 — THE VESSEL", text:
`A VESSEL IS NOT ITS OCCUPANT.

A KEY DOES NOT CHOOSE THE DOOR.

SOMEONE HAS ALREADY TURNED IT.` },
    { name:"ENTRY 05 — THE ANGEL", text:
`ONE MUST LEAVE.

ANOTHER MUST TAKE THEIR PLACE.

THE MOUNTAIN IS STILL WAITING.

IT REMEMBERS THE FIRST FOOTSTEP.` },
    { name:"ENTRY 06 — UNFINISHED", text:
`YOU BELIEVE THIS IS THE END.

YOU BELIEVE THE CHOICE HAS BEEN MADE.
YOU BELIEVE YOU KNOW WHO WILL REMAIN.

YOU HAVE NOT SEEN THE LAST PAGE.

...

THANK YOU FOR READING.` }
  ];

  let index = -1;
  let busy = false;

  function typeText(text, done) {
    busy = true;
    copy.textContent = "";
    let i = 0;
    const timer = setInterval(() => {
      copy.textContent += text.charAt(i++);
      if (i >= text.length) {
        clearInterval(timer);
        busy = false;
        if (done) done();
      }
    }, 27);
  }

  function showEntry() {
    if (busy) return;
    index++;
    if (index >= entries.length) {
      selfDestruct();
      return;
    }
    const entry = entries[index];
    title.textContent = entry.name;
    counter.textContent = String(index + 1).padStart(2,"0") + " / 06";
    next.textContent = index === entries.length - 1 ? "[ CLOSE THE RECORD ]" : "[ CONTINUE ]";
    next.disabled = true;
    typeText(entry.text, () => { next.disabled = false; });
  }

  function selfDestruct() {
    next.disabled = true;
    archive.classList.add("fade");
    try { localStorage.setItem(STORAGE_KEY, "yes"); } catch (_) {}
    setTimeout(() => {
      archive.remove();
      burned.style.display = "block";
      document.title = " ";
    }, 1900);
  }

  next.addEventListener("click", () => {
    if (index === entries.length - 1) selfDestruct();
    else showEntry();
  });

  // The opening line is already displayed; the first click reveals entry 01.
})();
</script>
</body>
</html>
